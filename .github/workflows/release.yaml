name: Release

on:
  push:
    tags:
      - "*"
  release:
    types: [created]

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $tag = '${{ github.event.release.tag_name }}'
          }
          "value=$tag" >> $env:GITHUB_OUTPUT

      - name: Create release for a pushed tag
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.tag.outputs.value }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ steps.tag.outputs.value }}" --generate-notes
          }

  release-windows:
    name: Release Windows Binaries
    needs: prepare-release
    runs-on: windows-2022

    strategy:
      matrix:
        goos: [windows]
        goarch: ["386", amd64]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.17'

      - name: Build release binary
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build `
            -ldflags "-X main.version=${{ needs.prepare-release.outputs.tag }}" `
            -o "eac3to-wrapper_windows_${{ matrix.goarch }}.exe"

      - name: Upload release binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" `
            "eac3to-wrapper_windows_${{ matrix.goarch }}.exe" `
            --clobber
