name: Release Windows Binaries

on:
  push:
    tags:
      - "*"
  release:
    types: [created]

jobs:
  build-windows:
    name: Build Windows (${{ matrix.goarch }})
    runs-on: windows-2022

    strategy:
      matrix:
        goarch: ["386", "amd64"]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'

      - name: Build release package
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $archive = "eac3to-wrapper-$env:RELEASE_VERSION-windows-${{ matrix.goarch }}.zip"
          go build `
            -ldflags "-X main.version=$env:RELEASE_VERSION" `
            -o eac3to-wrapper.exe
          Compress-Archive `
            -LiteralPath "eac3to-wrapper.exe" `
            -DestinationPath $archive `
            -CompressionLevel Optimal

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.goarch }}
          path: eac3to-wrapper-${{ github.event.release.tag_name || github.ref_name }}-windows-${{ matrix.goarch }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: build-windows
    runs-on: windows-2022
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: windows-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload Windows binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          target_commitish: ${{ github.event.release.tag_name || github.sha }}
          generate_release_notes: true
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
