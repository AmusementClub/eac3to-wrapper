name: Build (Windows)

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.17'

    - name: Build eac3to-wrapper
      shell: bash
      run: |
        go build -o eac3to-wrapper.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: release
        path: ./*.exe
